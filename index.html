<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bahari Leads - Sales Intelligence</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <header class="header">
        <div class="logo">
            <span class="logo-icon">🌊</span>
            <span class="logo-text">Bahari Leads</span>
        </div>
        <div class="lead-counter">
            <span id="lead-count">0</span> leads saved
        </div>
    </header>


    <main class="container">
        <!--Save Section -->
        <section class="quick-save">
            <h2 class="section-title">Quick Save</h2>

            <div class="action-buttons">
                <button id="tab-btn" class="btn btn-primary">
                    <span class="btn-icon">📌</span>
                    Save This Page
                </button>

                <button id="input-btn" class="btn btn-secondary">
                    <span class="btn-icon">➕</span>
                    Add Custom Lead
                </button>
            </div>

            <input type="text" id="input-el" class="input-field"
                placeholder="Enter LinkedIn URL, website, or company name...">
        </section>

        <div class="category-selector">
            <label>Category:</label>
            <select id="category-select">
                <option value="Hot Lead">🔥 Hot Lead</option>
                <option value="Warm Lead">☀️ Warm Lead</option>
                <option value="Cold Lead">❄️ Cold Lead</option>
                <option value="Follow-up">📞 Follow-up</option>
            </select>
        </div>

        <!-- Stats Section -->
        <section class="stats">
            <div class="stat-card">
                <div class="stat-number" id="today-count">0</div>
                <div class="stat-label">Today</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="week-count">0</div>
                <div class="stat-label">This Week</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="total-count">0</div>
                <div class="stat-label">All Time</div>
            </div>
        </section>

        <div class="search-bar">
            <input type="text" id="search-input" class="input-field" placeholder="🔍 Search leads..."
                oninput="searchLeads(this.value)">
        </div>

        <!-- Saved Leads Section -->
        <section class="leads-section">
            <div class="section-header">
                <h2 class="section-title">Saved Leads</h2>
                <button id="delete-btn" class="btn-text btn-danger">
                    Clear All
                </button>
            </div>

            <ul id="ul-el" class="leads-list">
                <!-- Leads will be rendered here -->
            </ul>

            <div id="empty-state" class="empty-state">
                <div class="empty-icon">🎯</div>
                <p class="empty-title">No leads saved yet</p>
                <p class="empty-text">Click "Save This Page" while on LinkedIn, company websites, or add custom URLs</p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>
            Built with ❤️ by Olga – Technical Product Marketing Manager ·
            <a href="https://github.com/SheillaO/Bahari-Leads" target="_blank" rel="noopener noreferrer">Open-sourced on
                GitHub</a> ·
            Hosted on <a href="https://baharileads.netlify.app/" target="_blank" rel="noopener noreferrer">Netlify</a>
        </p>
    </footer>


    <script src="index.js"></script>
</body>

</html>
